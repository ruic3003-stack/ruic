<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Cosmic Exploration</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        /* 船新改版：极简现代科技感 UI */
        #ui-layer {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            /* 4秒后自动淡出的动画 */
            animation: fadeOutContainer 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            animation-delay: 4s; 
        }
        .instruction {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.5);
            transition: opacity 0.8s ease;
        }
        @keyframes fadeOutContainer {
            to { opacity: 0; transform: translateY(10px); }
        }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="loading">INITIALIZING COSMOS...</div>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div class="instruction">DRAG TO ROTATE  •  PINCH TO ZOOM</div>
    </div>

    <script>
        // ==========================================
        // 1. 全局变量与核心纹理生成
        // ==========================================
        let scene, camera, renderer, controls;
        let time = 0;
        
        const objects = {
            planets: [], earth: null, clouds: null, orbits: [],
            comet: null, cometTrail: null, galaxyParticles: null, ambientStars: null,
            solarSystemGroup: new THREE.Group()
        };

        const TextureGen = {
            glow() {
                const cvs = document.createElement('canvas'); cvs.width = 64; cvs.height = 64; const ctx = cvs.getContext('2d');
                const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.3, 'rgba(255,255,255,0.6)');
                grad.addColorStop(0.7, 'rgba(255,255,255,0.1)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(cvs);
            },
            earthDay() {
                const cvs = document.createElement('canvas'); cvs.width = 1024; cvs.height = 512; const ctx = cvs.getContext('2d');
                ctx.fillStyle = '#0a3d62'; ctx.fillRect(0, 0, 1024, 512); ctx.fillStyle = '#3c6382';
                for(let i=0; i<120; i++) { ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*50+20, 0, Math.PI*2); ctx.fill(); }
                return new THREE.CanvasTexture(cvs);
            },
            earthNight() {
                const cvs = document.createElement('canvas'); cvs.width = 1024; cvs.height = 512; const ctx = cvs.getContext('2d');
                ctx.fillStyle = '#050510'; ctx.fillRect(0, 0, 1024, 512); ctx.fillStyle = '#fad390';
                for(let i=0; i<2500; i++) { ctx.fillRect(Math.random()*1024, Math.random()*512, Math.random()*2, Math.random()*2); }
                return new THREE.CanvasTexture(cvs);
            },
            clouds() {
                const cvs = document.createElement('canvas'); cvs.width = 1024; cvs.height = 512; const ctx = cvs.getContext('2d');
                ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0, 0, 1024, 512); ctx.fillStyle = 'rgba(255,255,255,0.4)';
                for(let i=0; i<150; i++) { ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*30+10, 0, Math.PI*2); ctx.fill(); }
                return new THREE.CanvasTexture(cvs);
            }
        };

        const textures = {
            glow: TextureGen.glow(), day: TextureGen.earthDay(), night: TextureGen.earthNight(), clouds: TextureGen.clouds()
        };
        // ==========================================
        // 2. 初始化场景与构建地球（修复兼容性版）
        // ==========================================
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100000);
            
            // 修复黑屏：关闭了 logarithmicDepthBuffer，大大提升移动端兼容性
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; 
            controls.dampingFactor = 0.05;
            controls.enablePan = false; 
            controls.minDistance = 1.5; 
            controls.maxDistance = 40000;

            buildGalaxy(); 
            buildSolarSystem(); 
            buildBlinkingStars();

            // 修复黑屏：初始相机放在安全区（远离太阳肚子），保证第一帧能正常渲染
            camera.position.set(0, 80, 150);
            
            // 隐藏加载提示
            setTimeout(() => {
                const loader = document.getElementById('loading');
                if(loader) loader.style.opacity = 0;
            }, 500);
            
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function buildEarth() {
            const earthGroup = new THREE.Group();
            const earthShader = {
                uniforms: { tDay: { value: textures.day }, tNight: { value: textures.night }, sunDirection: { value: new THREE.Vector3() } },
                vertexShader: `
                    varying vec2 vUv; varying vec3 vNormal; varying vec3 vWorldPosition;
                    void main() {
                        vUv = uv; vNormal = normalize(normalMatrix * normal);
                        vec4 worldPos = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPos.xyz; gl_Position = projectionMatrix * viewMatrix * worldPos;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDay; uniform sampler2D tNight; uniform vec3 sunDirection;
                    varying vec2 vUv; varying vec3 vNormal; varying vec3 vWorldPosition;
                    void main() {
                        vec3 lightDir = normalize(sunDirection - vWorldPosition);
                        float intensity = dot(vNormal, lightDir);
                        float blend = smoothstep(-0.1, 0.1, intensity);
                        gl_FragColor = mix(texture2D(tNight, vUv), texture2D(tDay, vUv), blend);
                    }
                `
            };

            objects.earth = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), new THREE.ShaderMaterial({
                uniforms: earthShader.uniforms, vertexShader: earthShader.vertexShader, fragmentShader: earthShader.fragmentShader
            }));
            earthGroup.add(objects.earth);

            objects.clouds = new THREE.Mesh(new THREE.SphereGeometry(1.02, 64, 64), new THREE.MeshBasicMaterial({
                map: textures.clouds, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            earthGroup.add(objects.clouds);

            return earthGroup;
        }
        // ==========================================
        // 3. 构建太阳系、彗星与背景闪烁星空
        // ==========================================
        function buildSolarSystem() {
            scene.add(objects.solarSystemGroup);

            const sun = new THREE.Mesh(new THREE.SphereGeometry(12, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            objects.solarSystemGroup.add(sun);
            const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: textures.glow, color: 0xffaa00, transparent: true, blending: THREE.AdditiveBlending }));
            sunGlow.scale.set(70, 70, 1); sun.add(sunGlow);
            scene.add(new THREE.PointLight(0xffffff, 2, 8000));

            const planetData = [
                { name: '水星', r: 0.4, d: 30, c: 0x9e9e9e, s: 0.05 }, { name: '金星', r: 0.9, d: 50, c: 0xfff2cc, s: 0.03 },
                { name: '地球', r: 1.0, d: 75, c: 0x4a90e2, s: 0.02, isEarth: true }, { name: '火星', r: 0.6, d: 100, c: 0xe74c3c, s: 0.016 },
                { name: '木星', r: 4.8, d: 150, c: 0xeccc68, s: 0.009 }, { name: '土星', r: 3.8, d: 210, c: 0xf5cd79, s: 0.006, hasRing: true },
                { name: '天王星', r: 2.5, d: 270, c: 0x70a1ff, s: 0.004 }, { name: '海王星', r: 2.4, d: 330, c: 0x1e90ff, s: 0.003 }
            ];

            planetData.forEach(p => {
                const orbitGeo = new THREE.BufferGeometry(); const orbitPts = [];
                for(let i=0; i<=90; i++) { let angle = (i / 90) * Math.PI * 2; orbitPts.push(Math.cos(angle)*p.d, 0, Math.sin(angle)*p.d); }
                orbitGeo.setAttribute('position', new THREE.Float32BufferAttribute(orbitPts, 3));
                const orbitLine = new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12 }));
                objects.solarSystemGroup.add(orbitLine); objects.orbits.push(orbitLine);

                let mesh = p.isEarth ? buildEarth() : new THREE.Mesh(new THREE.SphereGeometry(p.r, 32, 32), new THREE.MeshStandardMaterial({ color: p.c, roughness: 0.7 }));
                if(p.hasRing) {
                    const ring = new THREE.Mesh(new THREE.RingGeometry(p.r*1.4, p.r*2.3, 32), new THREE.MeshBasicMaterial({ color: p.c, side: THREE.DoubleSide, transparent: true, opacity: 0.6 }));
                    ring.rotation.x = Math.PI/2 + 0.2; mesh.add(ring);
                }
                objects.solarSystemGroup.add(mesh); objects.planets.push({ mesh: mesh, data: p, angle: Math.random()*Math.PI*2 });
            });

            objects.comet = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
            objects.solarSystemGroup.add(objects.comet);
            const tailLen = 35; const tailGeo = new THREE.BufferGeometry(); const tailColors = new Float32Array(tailLen * 3);
            for(let i=0; i<tailLen; i++) { let r = 1 - (i/tailLen); tailColors[i*3]=0; tailColors[i*3+1]=r; tailColors[i*3+2]=r; }
            tailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(tailLen*3), 3));
            tailGeo.setAttribute('color', new THREE.BufferAttribute(tailColors, 3));
            objects.cometTrail = new THREE.Line(tailGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.7 }));
            objects.solarSystemGroup.add(objects.cometTrail);
        }

        function buildBlinkingStars() {
            const count = 1500; const geo = new THREE.BufferGeometry(); const pos = new Float32Array(count * 3); const sizes = new Float32Array(count);
            for(let i=0; i<count; i++) {
                const u = Math.random(); const v = Math.random();
                const theta = u * 2.0 * Math.PI; const phi = Math.acos(2.0 * v - 1.0); const r = 6000 + Math.random() * 2000;
                pos[i*3] = r * Math.sin(phi) * Math.cos(theta); pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta); pos[i*3+2] = r * Math.cos(phi);
                sizes[i] = Math.random();
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('alphaPhase', new THREE.BufferAttribute(sizes, 1));
            objects.ambientStars = new THREE.Points(geo, new THREE.PointsMaterial({
                color: 0xffffff, size: 15, map: textures.glow, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            scene.add(objects.ambientStars);
        }
        // ==========================================
        // 4. 构建银河系与核心动画循环
        // ==========================================
        function buildGalaxy() {
            const starCount = 20000; const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(starCount * 3); const colors = new Float32Array(starCount * 3);
            const colorTheme = [new THREE.Color(0x4ab1ff), new THREE.Color(0xff9ff3), new THREE.Color(0xffffff)];

            for(let i=0; i<starCount; i++) {
                let r = Math.random() * 18000 + 600;
                let theta = r * 0.0008 + (Math.random() * Math.PI * 0.4);
                let arm = i % 2 === 0 ? 1 : -1;
                pos[i*3] = Math.cos(theta) * r * arm + (Math.random()-0.5)*r*0.25;
                pos[i*3+1] = (Math.random()-0.5)*450*(18000/r);
                pos[i*3+2] = Math.sin(theta) * r * arm + (Math.random()-0.5)*r*0.25;
                let c = colorTheme[Math.floor(Math.random() * colorTheme.length)];
                colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            objects.galaxyParticles = new THREE.Points(geo, new THREE.PointsMaterial({
                size: 45, map: textures.glow, blending: THREE.AdditiveBlending, vertexColors: true, transparent: true, opacity: 0, depthWrite: false
            }));
            scene.add(objects.galaxyParticles);
        }

        let cometTime = 0; let cometPositions = [];

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            let earthWorldPos = new THREE.Vector3();

            objects.planets.forEach(p => {
                p.angle += p.data.s * 0.8;
                p.mesh.position.x = Math.cos(p.angle) * p.d;
                p.mesh.position.z = Math.sin(p.angle) * p.d;

                if(p.data.isEarth) {
                    p.mesh.getWorldPosition(earthWorldPos);
                    objects.earth.rotation.y += 0.015;  
                    objects.clouds.rotation.y += 0.018; 
                    objects.earth.material.uniforms.sunDirection.value.set(-p.mesh.position.x, 0, -p.mesh.position.z).normalize();
                } else {
                    p.mesh.rotation.y += 0.02;
                }
            });

            if(objects.ambientStars) {
                objects.ambientStars.rotation.y += 0.0001;
                objects.ambientStars.material.size = 14 + Math.sin(time * 5) * 4;
            }

            cometTime += 0.008;
            let cx = Math.cos(cometTime)*380 - 100;
            let cz = Math.sin(cometTime)*120;
            objects.comet.position.set(cx, 0, cz);
            objects.comet.rotation.x += 0.05;
            
            cometPositions.unshift(new THREE.Vector3(cx, 0, cz));
            if(cometPositions.length > 35) cometPositions.pop();
            let posAttr = objects.cometTrail.geometry.attributes.position;
            for(let i=0; i<cometPositions.length; i++) {
                posAttr.setXYZ(i, cometPositions[i].x, cometPositions[i].y, cometPositions[i].z);
            }
            posAttr.needsUpdate = true;

            const distToSun = camera.position.distanceTo(new THREE.Vector3(0,0,0));
            const distToEarth = camera.position.distanceTo(earthWorldPos);

            let targetPos = new THREE.Vector3();
            if (distToSun > 450) {
                targetPos.set(0,0,0);
            } else if (distToEarth > 40) {
                let lerpFactor = (distToEarth - 40) / 410;
                targetPos.copy(earthWorldPos).lerp(new THREE.Vector3(0,0,0), Math.min(1, lerpFactor));
            } else {
                targetPos.copy(earthWorldPos);
            }
            controls.target.copy(targetPos);
            controls.update();

            if (objects.clouds) {
                let cloudOp = 1.0 - Math.max(0, (distToEarth - 15) / 25);
                objects.clouds.material.opacity = Math.max(0, Math.min(1, cloudOp));
            }
            let orbitOp = 0.12 - Math.max(0, (distToSun - 1000) / 500) * 0.12;
            objects.orbits.forEach(line => line.material.opacity = Math.max(0, orbitOp));

            if (objects.galaxyParticles) {
                let galOp = Math.max(0, (distToSun - 600) / 2000);
                objects.galaxyParticles.material.opacity = Math.min(1, galOp);
                objects.galaxyParticles.rotation.y += 0.0003; 
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
