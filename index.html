<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D Cosmic Exploration - Ultimate Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        canvas { display: block; width: 100% !important; height: 100% !important; outline: none; }
        
        /* 极简高级感科技交互UI层 */
        #ui-layer { position: absolute; bottom: 40px; width: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        .instruction { background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.1); font-size: 10px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.7); margin-bottom: 10px; text-transform: uppercase; }
        
        /* 动态天体中英文名字显示面板 */
        #info-panel { opacity: 0; transition: opacity 0.3s; text-align: center; background: radial-gradient(circle, rgba(0,255,255,0.15) 0%, rgba(0,0,0,0) 80%); padding: 20px; }
        #info-cn { font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); margin-bottom: 4px; }
        #info-en { font-size: 11px; letter-spacing: 5px; color: #00ffff; text-transform: uppercase; }
        
        /* 空间HUD尺度连续变换侦测器 */
        #scale-hud { position: absolute; top: 30px; left: 30px; background: rgba(0,0,0,0.65); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); border-left: 3px solid #00ffff; padding: 15px; pointer-events: none; transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        #scale-title { font-size: 13px; color: #00ffff; letter-spacing: 2px; margin-bottom: 8px; font-weight: bold; }
        #scale-details { font-size: 11px; color: #ccc; line-height: 1.6; letter-spacing: 1px; white-space: pre-wrap; }
        
        /* 退出聚焦、重置纵览按钮 */
        #reset-btn { position: absolute; top: 30px; right: 30px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 8px 16px; font-size: 11px; letter-spacing: 2px; cursor: pointer; display: none; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); transition: all 0.2s; pointer-events: auto; border-radius: 2px; }
        #reset-btn:hover { background: rgba(255,255,255,0.2); border-color: #00ffff; color: #00ffff; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; letter-spacing: 4px; color: rgba(255,255,255,0.5); transition: opacity 0.6s ease; pointer-events: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="loading">EXPANDING UNIVERSE ENGINE...</div>
    <div id="canvas-container"></div>
    
    <div id="scale-hud">
        <div id="scale-title">3. 行星际空间 (太阳系)</div>
        <div id="scale-details">- 数据初始化中...</div>
    </div>
    
    <button id="reset-btn">ESC | 返回全局视角</button>

    <div id="ui-layer">
        <div id="info-panel">
            <div id="info-cn">太阳系</div>
            <div id="info-en">SOLAR SYSTEM</div>
        </div>
        <div class="instruction">点击行星或轨道圈进行视轨追踪 • 滚动鼠标滚轮进行空间缩放</div>
    </div>

    <script>
        // 全局核心渲染组件与状态锁
        let scene, camera, renderer, controls;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let interactables = []; // 负责接收光线碰撞的交互物体阵列
        
        let time = 0;
        let isTracking = false;
        let targetObject = null; // 当前视界锚定的网格对象
        let trackType = 'NONE';  // 当前交互追踪级别：'PLANET', 'ORBIT', 'NONE'
        
        // 宇宙实体容器
        const objects = {
            planets: [], earth: null, earthGroup: null, clouds: null, atmospheres: [], 
            moon: null, orbits: [], meteors: [],
            kuiperBelt: null, oortCloud: null, 
            galaxyParticles: null, galaxyClusters: null, ambientStars: null,
            solarSystemGroup: new THREE.Group()
        };

        // 100%程序化无外部图片依赖的 Canvas 纹理发光及地表生成算法
        const TextureGen = {
            glow() {
                const cvs = document.createElement('canvas'); cvs.width = 64; cvs.height = 64; const ctx = cvs.getContext('2d');
                const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.3, 'rgba(255,255,255,0.6)');
                grad.addColorStop(0.7, 'rgba(255,255,255,0.1)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(cvs);
            },
            earthDay() {
                const cvs = document.createElement('canvas'); cvs.width = 512; cvs.height = 256; const ctx = cvs.getContext('2d');
                ctx.fillStyle = '#0a4275'; ctx.fillRect(0, 0, 512, 256); // 基础深蓝色大海
                ctx.fillStyle = '#27ae60'; // 大陆绿色板块
                for(let i=0; i<60; i++) { 
                    ctx.beginPath(); 
                    ctx.ellipse(Math.random()*512, Math.random()*256, Math.random()*50+15, Math.random()*30+10, Math.random()*Math.PI, 0, Math.PI*2); 
                    ctx.fill(); 
                }
                return new THREE.CanvasTexture(cvs);
            },
            earthNight() {
                const cvs = document.createElement('canvas'); cvs.width = 512; cvs.height = 256; const ctx = cvs.getContext('2d');
                ctx.fillStyle = '#010104'; ctx.fillRect(0, 0, 512, 256); // 寂静黑夜地表
                ctx.fillStyle = '#ffdf80'; // 繁华城市夜景灯光
                for(let i=0; i<900; i++) { 
                    let x = Math.random()*512, y = Math.random()*256;
                    if(Math.random() > 0.35) ctx.fillRect(x, y, Math.random()*1.5+0.5, Math.random()*1.5+0.5); 
                }
                return new THREE.CanvasTexture(cvs);
            },
            clouds() {
                const cvs = document.createElement('canvas'); cvs.width = 512; cvs.height = 256; const ctx = cvs.getContext('2d');
                ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0, 0, 512, 256); 
                ctx.fillStyle = 'rgba(255,255,255,0.45)'; // 动态气流云层
                for(let i=0; i<120; i++) { 
                    ctx.beginPath(); 
                    ctx.arc(Math.random()*512, Math.random()*256, Math.random()*28+6, 0, Math.PI*2); 
                    ctx.fill(); 
                }
                return new THREE.CanvasTexture(cvs);
            },
            moon() {
                const cvs = document.createElement('canvas'); cvs.width = 256; cvs.height = 128; const ctx = cvs.getContext('2d');
                ctx.fillStyle = '#777777'; ctx.fillRect(0, 0, 256, 128); 
                ctx.fillStyle = '#444444'; // 月球环形山特质纹理
                for(let i=0; i<100; i++) { 
                    ctx.beginPath(); ctx.arc(Math.random()*256, Math.random()*128, Math.random()*5+1, 0, Math.PI*2); ctx.fill(); 
                }
                return new THREE.CanvasTexture(cvs);
            }
        };

        const textures = {
            glow: TextureGen.glow(), day: TextureGen.earthDay(), night: TextureGen.earthNight(), clouds: TextureGen.clouds(), moon: TextureGen.moon()
        };

        function getSafeSize() {
            const container = document.getElementById('canvas-container');
            let w = container.clientWidth || window.innerWidth || 360;
            let h = container.clientHeight || window.innerHeight || 640;
            return { width: w, height: h };
        }
        // ==========================================
        // 3. 独立且高细节的地球生态子系统建造函数
        // ==========================================
        function buildEarthSystem(planetData) {
            objects.earthGroup = new THREE.Group();
            objects.earthGroup.userData = { isEarthSystem: true };

            // 1. 地球核心球体 (高级标准物理材质，内嵌发光贴图完美呈现日夜城市灯光)
            objects.earth = new THREE.Mesh(
                new THREE.SphereGeometry(1, 64, 64),
                new THREE.MeshStandardMaterial({
                    map: textures.day, 
                    emissive: new THREE.Color(0xffe17d), 
                    emissiveMap: textures.night, 
                    emissiveIntensity: 0.95, 
                    roughness: 0.55
                })
            );
            objects.earth.userData = { type: 'PLANET', cn: '地球', en: 'EARTH', parentGroup: objects.earthGroup };
            interactables.push(objects.earth);
            objects.earthGroup.add(objects.earth);

            // 2. 对流层 (作为独立外层几何体，承载云雾翻滚效果)
            objects.clouds = new THREE.Mesh(
                new THREE.SphereGeometry(1.018, 64, 64),
                new THREE.MeshLambertMaterial({ map: textures.clouds, transparent: true, opacity: 0.85, depthWrite: false })
            );
            objects.earthGroup.add(objects.clouds);

            // 3. 递进式大气圈层叠渲染 (平流层、中间层、热层、散逸层，利用BackSide与叠加混合模式呈现极光边缘感)
            const atmoLayers = [
                { r: 1.04, c: 0x5fa9ff, o: 0.25, name: '平流层' },
                { r: 1.08, c: 0x2288ff, o: 0.18, name: '中间层' },
                { r: 1.13, c: 0x9433ff, o: 0.12, name: '热层' },
                { r: 1.25, c: 0x4b369d, o: 0.06, name: '散逸层' }
            ];
            atmoLayers.forEach(layer => {
                let mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(layer.r, 32, 32),
                    new THREE.MeshBasicMaterial({ color: layer.c, transparent: true, opacity: layer.o, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide })
                );
                objects.atmospheres.push(mesh);
                objects.earthGroup.add(mesh);
            });

            // 4. 地月系统构造 (包含独立公转轨道与月表岩石斑驳贴图)
            const moonGroup = new THREE.Group();
            objects.moon = new THREE.Mesh(
                new THREE.SphereGeometry(0.27, 32, 32),
                new THREE.MeshStandardMaterial({ map: textures.moon, roughness: 0.85 })
            );
            objects.moon.position.set(4.5, 0, 0); 
            objects.moon.userData = { type: 'PLANET', cn: '月球', en: 'MOON' };
            interactables.push(objects.moon);
            moonGroup.add(objects.moon);
            
            // 地月距离空间连线
            const mOrbitGeo = new THREE.BufferGeometry(); const mPts = [];
            for(let i=0; i<=64; i++) { mPts.push(Math.cos(i/64*Math.PI*2)*4.5, 0, Math.sin(i/64*Math.PI*2)*4.5); }
            mOrbitGeo.setAttribute('position', new THREE.Float32BufferAttribute(mPts, 3));
            moonGroup.add(new THREE.Line(mOrbitGeo, new THREE.LineBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.25 })));
            
            objects.earthGroup.add(moonGroup);
            objects.earthGroup.moonSystem = moonGroup; 

            // 5. 动态近地小行星/陨石群 (沿随机高低差轨道做切线伴随运动)
            for(let i=0; i<4; i++) {
                let meteor = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), new THREE.MeshBasicMaterial({color: 0xffaa44}));
                meteor.userData = { angle: Math.random()*Math.PI*2, radius: 1.6 + Math.random()*0.8, speed: 0.03 + Math.random()*0.04 };
                objects.meteors.push(meteor);
                objects.earthGroup.add(meteor);
            }

            return objects.earthGroup;
        }
        // ==========================================
        // 4. 太阳系基础运行盘模型拼装
        // ==========================================
        function buildSolarSystem() {
            scene.add(objects.solarSystemGroup);

            // 中心发光炽热太阳
            const sun = new THREE.Mesh(new THREE.SphereGeometry(12, 64, 64), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            sun.userData = { type: 'PLANET', cn: '太阳', en: 'SUN' };
            interactables.push(sun);
            objects.solarSystemGroup.add(sun);
            
            // 太阳耀斑大气辉光精灵
            const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: textures.glow, color: 0xff7a00, transparent: true, blending: THREE.AdditiveBlending }));
            sunGlow.scale.set(85, 85, 1); sun.add(sunGlow);
            
            // 注入主光源与漫反射弱光线环境
            scene.add(new THREE.PointLight(0xffffff, 2.6, 12000));
            scene.add(new THREE.AmbientLight(0x1a1a1a));

            // 八大核心天体比例矩阵
            const planetData = [
                { cn: '水星', en: 'MERCURY', r: 0.4, d: 32, c: 0x9e9e9e, s: 0.035 }, 
                { cn: '金星', en: 'VENUS', r: 0.9, d: 52, c: 0xfff2cc, s: 0.026 },
                { cn: '地球', en: 'EARTH', r: 1.0, d: 78, c: 0x4a90e2, s: 0.018, isEarth: true }, 
                { cn: '火星', en: 'MARS', r: 0.6, d: 105, c: 0xe74c3c, s: 0.014 },
                { cn: '木星', en: 'JUPITER', r: 4.8, d: 165, c: 0xeccc68, s: 0.008 }, 
                { cn: '土星', en: 'SATURN', r: 3.8, d: 235, c: 0xf5cd79, s: 0.0055, hasRing: true },
                { cn: '天王星', en: 'URANUS', r: 2.5, d: 305, c: 0x70a1ff, s: 0.0038 }, 
                { cn: '海王星', en: 'NEPTUNE', r: 2.4, d: 375, c: 0x1e90ff, s: 0.0028 }
            ];

            planetData.forEach(p => {
                // 绘制视觉上的白色圆环轨迹圈
                const orbitGeo = new THREE.BufferGeometry(); const orbitPts = [];
                for(let i=0; i<=120; i++) { let a = (i/120)*Math.PI*2; orbitPts.push(Math.cos(a)*p.d, 0, Math.sin(a)*p.d); }
                orbitGeo.setAttribute('position', new THREE.Float32BufferAttribute(orbitPts, 3));
                const orbitLine = new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12 }));
                objects.solarSystemGroup.add(orbitLine);
                
                // 核心加固：创建隐形环状宽幅网格体，大大增强手势和点击运动轨迹圈时的判定成功率
                const hitRing = new THREE.Mesh(
                    new THREE.TorusGeometry(p.d, 2.5, 4, 64), 
                    new THREE.MeshBasicMaterial({ visible: false }) 
                );
                hitRing.rotation.x = Math.PI / 2;
                hitRing.userData = { type: 'ORBIT', cn: p.cn + '轨道', en: p.en + ' ORBIT', targetData: p };
                interactables.push(hitRing);
                objects.solarSystemGroup.add(hitRing);

                // 根据是否为地球实例化特定系统
                let mesh;
                if(p.isEarth) {
                    mesh = buildEarthSystem(p);
                } else {
                    mesh = new THREE.Mesh(new THREE.SphereGeometry(p.r, 32, 32), new THREE.MeshStandardMaterial({ color: p.c, roughness: 0.65 }));
                    mesh.userData = { type: 'PLANET', cn: p.cn, en: p.en };
                    interactables.push(mesh);
                    if(p.hasRing) {
                        const ring = new THREE.Mesh(new THREE.RingGeometry(p.r*1.4, p.r*2.4, 64), new THREE.MeshBasicMaterial({ color: p.c, side: THREE.DoubleSide, transparent: true, opacity: 0.55 }));
                        ring.rotation.x = Math.PI/2 + 0.18; mesh.add(ring);
                    }
                }
                objects.solarSystemGroup.add(mesh); 
                objects.planets.push({ mesh: mesh, data: p, angle: Math.random()*Math.PI*2 });
            });

            // 太阳系中外围：海王星外侧柯伊伯带冰封微行星群粒子
            const kbGeo = new THREE.BufferGeometry(); const kbPos = [];
            for(let i=0; i<3500; i++) {
                let a = Math.random()*Math.PI*2; let d = 425 + Math.random()*85;
                kbPos.push(Math.cos(a)*d, (Math.random()-0.5)*18, Math.sin(a)*d);
            }
            kbGeo.setAttribute('position', new THREE.Float32BufferAttribute(kbPos, 3));
            objects.kuiperBelt = new THREE.Points(kbGeo, new THREE.PointsMaterial({color: 0x999999, size: 0.75, transparent: true, opacity: 0.45}));
            objects.solarSystemGroup.add(objects.kuiperBelt);
            
            // 太阳系最外围：边界庞大的球壳状奥尔特云大星团点阵
            const ocGeo = new THREE.BufferGeometry(); const ocPos = [];
            for(let i=0; i<4500; i++) {
                let u = Math.random(), v = Math.random();
                let theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0), r = 1300 + Math.random()*600;
                ocPos.push(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
            }
            ocGeo.setAttribute('position', new THREE.Float32BufferAttribute(ocPos, 3));
            objects.oortCloud = new THREE.Points(ocGeo, new THREE.PointsMaterial({color: 0x666666, size: 1.8, transparent: true, opacity: 0.35}));
            objects.solarSystemGroup.add(objects.oortCloud);
        }
        // ==========================================
        // 5. 宏观深空大尺度场景构建
        // ==========================================
        function buildDeepSpace() {
            // 恒星际空间：银河系悬臂结构高密度复合粒子系统
            const starCount = 8500; const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(starCount * 3); const colors = new Float32Array(starCount * 3);
            const colorTheme = [new THREE.Color(0x55b4ff), new THREE.Color(0xffa6f6), new THREE.Color(0xffffff)];

            for(let i=0; i<starCount; i++) {
                let r = Math.random() * 8500 + 2200;
                let theta = r * 0.00045 + (Math.random() * Math.PI * 0.55);
                let arm = i % 2 === 0 ? 1 : -1;
                pos[i*3] = Math.cos(theta) * r * arm + (Math.random()-0.5)*r*0.28;
                pos[i*3+1] = (Math.random()-0.5)*450*(8500/r);
                pos[i*3+2] = Math.sin(theta) * r * arm + (Math.random()-0.5)*r*0.28;
                let c = colorTheme[Math.floor(Math.random() * colorTheme.length)];
                colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            objects.galaxyParticles = new THREE.Points(geo, new THREE.PointsMaterial({
                size: 38, map: textures.glow, blending: THREE.AdditiveBlending, vertexColors: true, transparent: true, opacity: 0.35, depthWrite: false
            }));
            scene.add(objects.galaxyParticles);

            // 星系际空间：处于极端宇宙深空处的超大型交织星系团发光网格
            const clusterGeo = new THREE.BufferGeometry(); const clusterPos = [];
            for(let i=0; i<600; i++) {
                let r = 16000 + Math.random() * 11000; 
                let theta = Math.random() * Math.PI * 2, phi = Math.acos(2.0 * Math.random() - 1.0);
                clusterPos.push(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
            }
            clusterGeo.setAttribute('position', new THREE.Float32BufferAttribute(clusterPos, 3));
            objects.galaxyClusters = new THREE.Points(clusterGeo, new THREE.PointsMaterial({
                color: 0xffb3d1, size: 220, map: textures.glow, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            scene.add(objects.galaxyClusters);
        }

        // ==========================================
        // 6. 三维射线交互捕获器
        // ==========================================
        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactables, false);

            if (intersects.length > 0) {
                let hit = intersects[0].object;
                let data = hit.userData;

                const infoPanel = document.getElementById('info-panel');
                document.getElementById('info-cn').innerText = data.cn;
                document.getElementById('info-en').innerText = data.en;
                infoPanel.style.opacity = 1;
                document.getElementById('reset-btn').style.display = 'block';

                if (data.type === 'PLANET') {
                    isTracking = true;
                    trackType = 'PLANET'; // 精确绑定星球体，触发贴紧追随自转
                    targetObject = hit;
                } else if (data.type === 'ORBIT') {
                    isTracking = true;
                    trackType = 'ORBIT';  // 绑定对应公转网格，触发大视角跟随公转轨线
                    let planetEntry = objects.planets.find(p => p.data.cn === data.targetData.cn);
                    targetObject = planetEntry ? planetEntry.mesh : null;
                }
            }
        }
        window.addEventListener('click', onMouseClick);
        
        // 逃逸按钮重置全景
        document.getElementById('reset-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            isTracking = false;
            trackType = 'NONE';
            targetObject = null;
            document.getElementById('info-panel').style.opacity = 0;
            document.getElementById('reset-btn').style.display = 'none';
        });
        // ==========================================
        // 7. 动态高精度连续宇宙LOD尺度深度计算器
        // ==========================================
        function updateScaleHUD() {
            let distance = controls.getDistance();
            let title = "", details = "";

            // 判断距离以及聚焦状态是否隶属于地球系统
            if (distance < 2.5 && targetObject && (targetObject.userData.cn === '地球' || (targetObject.userData.parentGroup && targetObject.userData.parentGroup.userData.isEarthSystem))) {
                title = "1. 大气层 (地球圈层)";
                details = "- 对流层 (极度拉近可见云气流动)\n- 平流层\n- 中间层\n- 热层\n- 散逸层";
            } else if (distance < 16 && targetObject && (targetObject.userData.cn === '地球' || (targetObject.userData.parentGroup && targetObject.userData.parentGroup.userData.isEarthSystem))) {
                title = "2. 近地空间 (地月系)";
                details = "- 地月空间\n- 月球、环绕陨石及公转轨道";
            } else if (distance < 850) {
                title = "3. 行星际空间 (太阳系)";
                details = "- 八大核心行星公转盘面\n- 柯伊伯带 (太阳系外围边缘盘)";
            } else if (distance < 4200) {
                title = "4. 太阳系外围空间";
                details = "- 奥尔特云 (包裹太阳系的球壳状星云)";
            } else if (distance < 13000) {
                title = "5. 恒星际空间";
                details = "- 银河系旋臂星际气体与微粒\n- 周边恒星及伴星系";
            } else {
                title = "6. 星系际空间";
                details = "- 宇宙超星系团网状交织结构\n- 浩瀚各向同性宇宙最深空";
            }

            document.getElementById('scale-title').innerText = title;
            document.getElementById('scale-details').innerText = details;
        }

        // ==========================================
        // 8. 核心环境双火初始化
        // ==========================================
        function init() {
            const size = getSafeSize();
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(60, size.width / size.height, 0.1, 95000);
            camera.position.set(0, 180, 450);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(size.width, size.height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; 
            controls.dampingFactor = 0.05;
            controls.maxDistance = 35000; 
            controls.minDistance = 1.05; // 允许玩家视线几乎贴在地球对流层云雾表层进行极限细节观察

            buildSolarSystem();
            buildDeepSpace();

            const loadingEl = document.getElementById('loading');
            if (loadingEl) { loadingEl.style.opacity = '0'; setTimeout(() => loadingEl.remove(), 600); }
            
            window.addEventListener('resize', () => {
                const size = getSafeSize();
                camera.aspect = size.width / size.height; camera.updateProjectionMatrix();
                renderer.setSize(size.width, size.height);
            });
        }
        // 临时三维向量分配空间，防止内存高频分配引发卡顿垃圾回收
        const targetVec = new THREE.Vector3();
        const cameraOffset = new THREE.Vector3();

        // ==========================================
        // 9. 主逻辑帧循环渲染与摄像机差值Lerp算法
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // 1. 各天体轨道动力学：独立自转与公转
            objects.planets.forEach(p => {
                p.angle += p.data.s * 0.16; 
                p.mesh.position.x = Math.cos(p.angle) * p.data.d;
                p.mesh.position.z = Math.sin(p.angle) * p.data.d;
                
                if(p.data.isEarth) {
                    if(objects.earth) objects.earth.rotation.y += 0.005; // 地球自转
                    if(objects.clouds) objects.clouds.rotation.y += 0.0065; // 云雾独立飘动速度差
                    if(p.mesh.moonSystem) p.mesh.moonSystem.rotation.y += 0.0022; // 月球绕地运行
                    
                    // 环绕地球高速流窜的微型小陨石群
                    objects.meteors.forEach(m => {
                        m.userData.angle += m.userData.speed;
                        m.position.x = Math.cos(m.userData.angle) * m.userData.radius;
                        m.position.y = Math.sin(m.userData.angle * 1.5) * 0.4;
                        m.position.z = Math.sin(m.userData.angle) * m.userData.radius;
                    });
                } else {
                    p.mesh.rotation.y += 0.015; // 其他非地球行星各自转速
                }
            });

            // 背景宏观星宇点阵以及边缘碎石盘带的极缓慢旋转
            if (objects.galaxyParticles) objects.galaxyParticles.rotation.y = time * 0.003;
            if (objects.kuiperBelt) objects.kuiperBelt.rotation.y = time * 0.0008;

            // 2. 摄像机物理级跟随与差值缓动锁定 (实现镜头伴随公转且可近距离拉伸)
            if (isTracking && targetObject) {
                targetObject.getWorldPosition(targetVec);
                
                // 将轨道控制器的靶心平滑拉向目标天体
                controls.target.lerp(targetVec, 0.05);

                if (trackType === 'PLANET') {
                    let radius = 1;
                    if (targetObject.geometry && targetObject.geometry.parameters) {
                        radius = targetObject.geometry.parameters.radius;
                    } else if (targetObject.userData.cn === '地球') {
                        radius = 1.0;
                    }
                    let idealDist = radius * 4.2; // 根据天体自身的物理几何体半径决定镜头贴近的最佳距离
                    
                    // 运算公式：在维持用户鼠标手动拖拽改变的朝向夹角下，平滑修正相机与目标星球的距离间隔
                    cameraOffset.copy(camera.position).sub(targetVec).normalize().multiplyScalar(idealDist);
                    let idealCamPos = targetVec.clone().add(cameraOffset);
                    camera.position.lerp(idealCamPos, 0.035);
                }
            } else {
                // 自由视角状态下，平滑将焦点重心还给核心主太阳
                controls.target.lerp(new THREE.Vector3(0,0,0), 0.05);
            }

            controls.update();
            updateScaleHUD(); // 实时触发相机相对距离检测

            renderer.render(scene, camera);
        }

        // 核心双火引擎启动
        init();
        animate();
    </script>
</body>
</html>
